name: Eraser - Monthly Privacy Requests

on:
  schedule:
    # 09:00 UTC on the 1st of each month.
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — render emails but send nothing'
        type: boolean
        default: true

# Never let a manual run overlap a scheduled one; a second sender would
# duplicate every request the first is midway through.
concurrency:
  group: eraser-send
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  eraser:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify required secrets
        env:
          ERASER_FIRST_NAME: ${{ secrets.ERASER_FIRST_NAME }}
          ERASER_LAST_NAME: ${{ secrets.ERASER_LAST_NAME }}
          ERASER_EMAIL: ${{ secrets.ERASER_EMAIL }}
          ERASER_SMTP_HOST: ${{ secrets.ERASER_SMTP_HOST }}
          ERASER_SMTP_PORT: ${{ secrets.ERASER_SMTP_PORT }}
          ERASER_SMTP_USERNAME: ${{ secrets.ERASER_SMTP_USERNAME }}
          ERASER_SMTP_PASSWORD: ${{ secrets.ERASER_SMTP_PASSWORD }}
          ERASER_HISTORY_KEY: ${{ secrets.ERASER_HISTORY_KEY }}
        run: |
          missing=""
          for name in ERASER_FIRST_NAME ERASER_LAST_NAME ERASER_EMAIL \
                      ERASER_SMTP_HOST ERASER_SMTP_PORT ERASER_SMTP_USERNAME ERASER_SMTP_PASSWORD \
                      ERASER_HISTORY_KEY; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi

      - name: Build Eraser
        run: go build -o eraser ./cmd/eraser

      - name: Test Eraser
        run: go test ./...

      - name: Restore request history
        env:
          GH_TOKEN: ${{ github.token }}
          ERASER_HISTORY_KEY: ${{ secrets.ERASER_HISTORY_KEY }}
        run: |
          set -e
          mkdir -p ~/.eraser
          history_dir=$(mktemp -d)
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow main.yml \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::warning::No prior history found — treating every broker as uncontacted."
          elif [ -z "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                    --jq '.artifacts[] | select(.name == "eraser-history") | .id' | head -n 1)" ]; then
            echo "::warning::No prior history found — treating every broker as uncontacted."
          else
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              -n eraser-history -D "$history_dir"
            if [ -f "$history_dir/history.db.enc" ]; then
              openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -d \
                -pass env:ERASER_HISTORY_KEY -in "$history_dir/history.db.enc" \
                -out ~/.eraser/history.db
            elif [ -f "$history_dir/history.db" ]; then
              mv "$history_dir/history.db" ~/.eraser/history.db
            else
              echo "::error::The eraser-history artifact contains no history database."
              exit 1
            fi
            echo "Restored history from run $run_id"
          fi

      - name: Write config
        env:
          ERASER_FIRST_NAME: ${{ secrets.ERASER_FIRST_NAME }}
          ERASER_LAST_NAME: ${{ secrets.ERASER_LAST_NAME }}
          ERASER_EMAIL: ${{ secrets.ERASER_EMAIL }}
          ERASER_ADDRESS: ${{ secrets.ERASER_ADDRESS }}
          ERASER_CITY: ${{ secrets.ERASER_CITY }}
          ERASER_STATE: ${{ secrets.ERASER_STATE }}
          ERASER_ZIP_CODE: ${{ secrets.ERASER_ZIP_CODE }}
          ERASER_COUNTRY: ${{ secrets.ERASER_COUNTRY }}
          ERASER_PHONE: ${{ secrets.ERASER_PHONE }}
          ERASER_DATE_OF_BIRTH: ${{ secrets.ERASER_DATE_OF_BIRTH }}
          ERASER_SMTP_HOST: ${{ secrets.ERASER_SMTP_HOST }}
          ERASER_SMTP_PORT: ${{ secrets.ERASER_SMTP_PORT }}
          ERASER_SMTP_USERNAME: ${{ secrets.ERASER_SMTP_USERNAME }}
          ERASER_SMTP_PASSWORD: ${{ secrets.ERASER_SMTP_PASSWORD }}
          ERASER_REPLY_TO: ${{ secrets.ERASER_REPLY_TO }}
          ERASER_TEMPLATE: ${{ secrets.ERASER_TEMPLATE }}
        run: |
          umask 077
          mkdir -p ~/.eraser
          # JSON is valid YAML, and jq escapes every value correctly — no quoting
          # traps from a colon or quote inside an address or password.
          jq -n \
            --arg first    "$ERASER_FIRST_NAME" \
            --arg last     "$ERASER_LAST_NAME" \
            --arg email    "$ERASER_EMAIL" \
            --arg address  "$ERASER_ADDRESS" \
            --arg city     "$ERASER_CITY" \
            --arg state    "$ERASER_STATE" \
            --arg zip      "$ERASER_ZIP_CODE" \
            --arg country  "$ERASER_COUNTRY" \
            --arg phone    "$ERASER_PHONE" \
            --arg dob      "$ERASER_DATE_OF_BIRTH" \
            --arg host     "$ERASER_SMTP_HOST" \
            --argjson port "${ERASER_SMTP_PORT:-465}" \
            --arg user     "$ERASER_SMTP_USERNAME" \
            --arg pass     "$ERASER_SMTP_PASSWORD" \
            --arg replyto  "$ERASER_REPLY_TO" \
            --arg template "${ERASER_TEMPLATE:-generic}" \
            '{
              profile: {
                first_name: $first, last_name: $last, email: $email,
                address: $address, city: $city, state: $state,
                zip_code: $zip, country: $country, phone: $phone,
                date_of_birth: $dob
              },
              email: {
                provider: "smtp",
                from: $user,
                reply_to: $replyto,
                smtp: { host: $host, port: $port, username: $user, password: $pass, use_tls: true }
              },
              options: {
                template: $template,
                rate_limit_ms: 2000,
                resend_after_days: 180,
                max_per_run: 400
              },
              inbox: {
                enabled: true,
                provider: "gmail",
                email: $user,
                password: $pass,
                folder: "Eraser",
                auto_archive: false,
                archive_folder: "Eraser"
              }
            }' > ~/.eraser/config.yaml

      - name: Send removal requests
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            ./eraser send --dry-run
          else
            ./eraser send
          fi

      - name: Monitor broker replies
        # Best effort: emails are already sent, so an IMAP hiccup must not fail the run.
        continue-on-error: true
        run: |
          echo "ERASER_RUN_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          ./eraser monitor --once --days 35

      - name: Confirm broker links
        continue-on-error: true
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            ./eraser confirm --pending --dry-run
          else
            ./eraser confirm --pending
          fi

      - name: Fill and submit broker forms
        continue-on-error: true
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: skipping browser form filling"
          else
            ./eraser fill --pending --submit --headless=true
          fi

      - name: Send monthly digest
        continue-on-error: true
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            ./eraser digest --dry-run
          else
            ./eraser digest
          fi

      - name: Save request history
        if: always()
        env:
          ERASER_HISTORY_KEY: ${{ secrets.ERASER_HISTORY_KEY }}
        run: |
          set -e
          mkdir -p artifact
          if [ -f ~/.eraser/history.db ]; then
            [ -n "$ERASER_HISTORY_KEY" ] || { echo "::error::ERASER_HISTORY_KEY is missing"; exit 1; }
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
              -pass env:ERASER_HISTORY_KEY -in ~/.eraser/history.db \
              -out artifact/history.db.enc
          else
            echo "no history db to save"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eraser-history
          path: artifact/history.db.enc
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
